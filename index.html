<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>מפת פמ"ת (GeoTIFF) + מטוסים סביב נתב"ג</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height:100%; margin:0; }
    .panel {position:absolute; top:16px; right:16px; z-index:1000; background:#fff; padding:12px 14px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.2); max-width:360px; font-family:system-ui,Arial;}
    .panel h3{margin:0 0 8px; font-size:16px}
    .row{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; margin:8px 0}
    .row-1{margin-top:6px}
    .btn{padding:8px 10px; background:#2563eb; color:#fff; border:0; border-radius:8px; cursor:pointer}
    .btn.secondary{background:#475569}
    #status{font-size:12px; color:#14532d}
    #error{font-size:12px; color:#b91c1c}
    .plane-icon{width:28px; height:28px; transform:translate(-14px,-14px)}
    .plane-icon svg{width:28px; height:28px; transform-origin:50% 50%}
    .leaflet-tooltip{direction:rtl; text-align:right}
  </style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h3>מפת פמ"ת (GeoTIFF) + מטוסים סביב נתב"ג</h3>
  <div class="row">
    <label>Load: GeoTIFF</label>
    <input id="file" type="file" accept=".tif,.tiff" />
  </div>
  <div class="row">
    <label>שקיפות המפה:</label>
    <input id="opacity" type="range" min="0" max="1" step="0.02" value="0.7" />
  </div>
  <div class="row">
    <label>מקור נתונים:</label>
    <select id="provider"><option value="adsb.lol">ADSB.lol (ללא מפתח)</option></select>
  </div>
  <div class="row">
    <label>רדיוס (NM):</label>
    <input id="distNm" type="number" min="10" max="150" step="5" value="100" />
  </div>
  <div class="row">
    <button id="centerLlbg" class="btn">מרכז נתב"ג</button>
    <button id="clearOverlay" class="btn secondary">הסר GeoTIFF</button>
  </div>
  <div class="row-1"><div id="status"></div><div id="error"></div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/geotiff@2.1.3/dist-browser/geotiff.min.js"></script>
<script src="https://unpkg.com/georaster@1.6.1/dist/georaster.browser.min.js"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>
<script>
  // ==== הגדרות בסיס ====
  var LLBG = { lat: 31.9906, lon: 34.8663 };
  var DIST_NM = 100;
  var map = L.map('map', { preferCanvas:true }).setView([LLBG.lat, LLBG.lon], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);

  var planesLayer = L.layerGroup().addTo(map);
  var planeMarkers = new Map();
  var geoLayer = null; var nmCircle = null;

  function updateCircle(){
    var meters = DIST_NM * 1852;
    if (nmCircle) nmCircle.remove();
    nmCircle = L.circle([LLBG.lat, LLBG.lon], {radius:meters, color:'#2563eb', weight:1, fill:false}).addTo(map);
  }
  updateCircle();

  function planeIcon(deg){
    var svg = '<svg viewBox="0 0 24 24" style="transform: rotate(' + deg + 'deg);">' +
              '<path d="M12 2l2.5 7H22l-7 5 2.5 8L12 17 4.5 22 7 12 0 9h7.5L12 2z" fill="currentColor"/>' +
              '</svg>';
    return L.divIcon({ className:'plane-icon', html:svg, iconSize:[28,28], iconAnchor:[14,14] });
  }

  function tooltipHTML(p){
    var id = p.callsign || p.hex || 'N/A';
    var alt = (p.alt==null? '?' : p.alt);
    var gs  = (p.spd==null? '?' : p.spd);
    var hdg = isFinite(p.hdg) ? Math.round(p.hdg) : '?';
    return id + '<br/>ALT: ' + alt + 'ft | GS: ' + gs + 'kt | HDG: ' + hdg + '°';
  }

  function setStatus(m){ document.getElementById('status').textContent = m || ''; }
  function setError(m){ document.getElementById('error').textContent = m || ''; }

  async function fetchPlanesLOL(lat, lon, distNm){
    var url = 'https://api.adsb.lol/v2/point/' + lat + '/' + lon + '/' + distNm;
    var r = await fetch(url, { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    var list = (data.ac || []);
    return list.map(function(p){
      return { lat:p.lat, lon:p.lon, hdg:Number(p.track||0), spd:p.gs, alt:p.alt_baro, callsign:(p.flight||'').trim(), hex:p.hex };
    }).filter(function(m){ return Number.isFinite(m.lat) && Number.isFinite(m.lon) && m.hex; });
  }

  async function refresh(){
    setError('');
    try{
      var planes = await fetchPlanesLOL(LLBG.lat, LLBG.lon, DIST_NM);
      var seen = new Set();
      planes.forEach(function(p){
        seen.add(p.hex);
        var pos = [p.lat, p.lon];
        if (!planeMarkers.has(p.hex)){
          var marker = L.marker(pos, { icon: planeIcon(p.hdg) }).bindTooltip(tooltipHTML(p));
          marker.addTo(planesLayer);
          planeMarkers.set(p.hex, { marker:marker, last:Date.now() });
        } else {
          var obj = planeMarkers.get(p.hex);
          obj.marker.setLatLng(pos);
          obj.marker.setIcon(planeIcon(p.hdg));
          obj.marker.setTooltipContent(tooltipHTML(p));
          obj.last = Date.now();
        }
      });
      // הסרת ישנים
      var now = Date.now();
      planeMarkers.forEach(function(obj, hex){
        if (!seen.has(hex) && now - obj.last > 60000){ obj.marker.remove(); planeMarkers.delete(hex); }
      });
      setStatus('נמצאו ' + planes.length + ' מטוסים | מקור: ADSB.lol | רענון כל 10 שניות');
      updateCircle();
    }catch(e){ setError('Failed to fetch: ' + e.message + ' | בדוק חוסם פרסומות או חיבור אינטרנט'); }
  }
  refresh(); setInterval(refresh, 10000);

  async function loadGeoTiff(file){
    setError(''); setStatus('טוען GeoTIFF...');
    try{
      var arr = await file.arrayBuffer();
      var georaster = await parseGeoraster(arr);
      if (geoLayer) { map.removeLayer(geoLayer); geoLayer = null; }
      geoLayer = new GeoRasterLayer({ georaster:georaster, opacity:Number(document.getElementById('opacity').value||0.7), resolution:256 });
      geoLayer.addTo(map);
      try{ map.fitBounds(geoLayer.getBounds(), { padding:[30,30] }); } catch(_){}
      setStatus('GeoTIFF נטען בהצלחה');
    }catch(err){ setError('טעינת GeoTIFF נכשלה: ' + err.message + ' | ודא שזה GeoTIFF ב-EPSG:4326'); }
  }

  document.getElementById('file').addEventListener('change', function(e){ var f=e.target.files&&e.target.files[0]; if(f) loadGeoTiff(f); });
  document.getElementById('opacity').addEventListener('input', function(e){ if(geoLayer) geoLayer.setOpacity(Number(e.target.value)); });
  document.getElementById('clearOverlay').addEventListener('click', function(){ if(geoLayer){ map.removeLayer(geoLayer); geoLayer=null; setStatus('GeoTIFF הוסר'); }});
  document.getElementById('centerLlbg').addEventListener('click', function(){ map.setView([LLBG.lat, LLBG.lon], 10); updateCircle(); });
  document.getElementById('distNm').addEventListener('change', function(){ DIST_NM = Number(this.value||100); updateCircle(); refresh(); });
  document.getElementById('provider').addEventListener('change', refresh);
</script>
</body>
</html>
