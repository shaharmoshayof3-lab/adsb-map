<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>מפת פמ"ת (GeoTIFF) + מטוסים סביב נתב"ג</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height:100%; margin:0; }
    .panel {position:absolute; top:16px; right:16px; z-index:1000; background:#fff; padding:12px 14px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.2); max-width:420px; font-family:system-ui,Arial;}
    .panel h3{margin:0 0 8px; font-size:16px}
    .row{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; margin:8px 0}
    .row-1{margin-top:6px}
    .btn{padding:8px 10px; background:#2563eb; color:#fff; border:0; border-radius:8px; cursor:pointer}
    .btn.secondary{background:#475569}
    #status{font-size:12px; color:#14532d}
    #error{font-size:12px; color:#b91c1c}

    .plane-icon{ width:30px; height:30px; transform:translate(-15px,-15px); }
    .plane-icon img{ width:30px; height:30px; transform-origin:50% 50%; filter: drop-shadow(0 0 1px rgba(0,0,0,.6)); }
    .leaflet-tooltip{direction:rtl; text-align:right}
    .legend{font-size:12px;color:#334155;margin-top:4px}
    .legend span{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:4px;vertical-align:middle}
  </style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h3>מפת פמ"ת (GeoTIFF) + מטוסים סביב נתב"ג</h3>
  <div class="row"><label>Load GeoTIFF (אופציונלי):</label><input id="file" type="file" accept=".tif,.tiff" /></div>
  <div class="row"><label>שקיפות המפה:</label><input id="opacity" type="range" min="0" max="1" step="0.02" value="0.7" /></div>
  <div class="row"><label>מקור נתונים:</label><select id="provider"><option value="adsb.lol">ADSB.lol (דרך ה-Worker)</option></select></div>
  <div class="row"><label>רדיוס (NM):</label><input id="distNm" type="number" min="10" max="150" step="5" value="100" /></div>
  <div class="row"><button id="centerLlbg" class="btn">מרכז נתב"ג</button><button id="clearOverlay" class="btn secondary">הסר GeoTIFF</button></div>
  <div class="legend">צבע לפי גובה: <span style="background:#16a34a"></span> נמוך <span style="background:#2563eb"></span> בינוני <span style="background:#9333ea"></span> גבוה <span style="background:#ef4444"></span> גבוה מאוד</div>
  <div class="row-1"><div id="status"></div><div id="error"></div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/geotiff@2.1.3/dist-browser/geotiff.min.js"></script>
<!-- ⭐️ השורה החסרה שתיקנה את parseGeoraster -->
<script src="https://unpkg.com/georaster@1.6.1/dist/georaster.browser.min.js"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>
<script>
  // ===== הגדרות =====
  var LLBG = { lat: 31.9906, lon: 34.8663 };
  var DIST_NM = 100;
  var PROXY_BASE = 'https://misty-wildflower-6947.shaharmoshayof3.workers.dev';
  // GeoTIFF ששמת בריפו (אותו דומיין => אין CORS):
  var GEO_TIFF_URL = 'ATS1.tif';

  var map = L.map('map', { preferCanvas:true }).setView([LLBG.lat, LLBG.lon], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);

  var planesLayer = L.layerGroup().addTo(map);
  var trailsLayer = L.layerGroup().addTo(map);
  var planeMarkers = new Map();
  var selectedHex = null;
  var trailData = [];
  var trailPolyline = L.polyline([], { color:'#84cc16', weight:3, opacity:0.9 }).addTo(trailsLayer);

  var geoLayer = null; var nmCircle = null;

  function updateCircle(){
    var meters = DIST_NM * 1852; if (nmCircle) nmCircle.remove();
    nmCircle = L.circle([LLBG.lat, LLBG.lon], {radius:meters, color:'#2563eb', weight:1, fill:false}).addTo(map);
  }
  updateCircle();

  function altStyle(alt){
    if (alt == null) return { hue: 0, size: 28, saturate:1.0, bright:1.0 };
    if (alt < 1500)  return { hue:110, size: 30, saturate:1.3, bright:1.15 }; // ירוק
    if (alt < 10000) return { hue:220, size: 28, saturate:1.2, bright:1.10 }; // כחול
    if (alt < 25000) return { hue:285, size: 26, saturate:1.1, bright:1.05 }; // סגול
    return { hue:  0, size: 26, saturate:1.0, bright:1.00 }; // אדום
  }

  function planeImgIcon(deg, alt){
    var st = altStyle(alt);
    var s = st.size;
    var html = '<img src="a320.svg" style="width:'+s+'px;height:'+s+'px;transform:rotate('+(deg||0)+'deg);transform-origin:50% 50%;filter:hue-rotate('+st.hue+'deg) saturate('+st.saturate+') brightness('+st.bright+')">';
    return L.divIcon({ className:'plane-icon', html: html, iconSize:[s,s], iconAnchor:[s/2,s/2] });
  }

  function tooltipHTML(p){
    var id = p.callsign || p.hex || 'N/A';
    var alt = (p.alt==null? '?' : p.alt);
    var gs  = (p.spd==null? '?' : p.spd);
    var hdg = isFinite(p.hdg) ? Math.round(p.hdg) : '?';
    return id + '<br/>ALT: ' + alt + 'ft | GS: ' + gs + 'kt | HDG: ' + hdg + '°';
  }

  function setStatus(m){ document.getElementById('status').textContent = m || ''; }
  function setError(m){ document.getElementById('error').textContent = m || ''; }

  async function fetchPlanes(lat, lon, distNm){
    var url = PROXY_BASE + '/point/' + lat + '/' + lon + '/' + distNm;
    var r = await fetch(url, { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    var list = (data.ac || []);
    return list.map(function(p){
      return { lat:p.lat, lon:p.lon, hdg:Number(p.track||0), spd:p.gs, alt:p.alt_baro, callsign:(p.flight||'').trim(), hex:p.hex };
    }).filter(function(m){ return Number.isFinite(m.lat) && Number.isFinite(m.lon) && m.hex; });
  }

  function selectPlane(hex){ selectedHex = hex; trailData = []; trailPolyline.setLatLngs([]); }
  function attachSelectHandler(marker, hex){ marker.on('click', function(){ selectPlane(hex); }); }

  async function refresh(){
    setError('');
    try{
      var planes = await fetchPlanes(LLBG.lat, LLBG.lon, DIST_NM);
      var seen = new Set();
      var now = Date.now();

      planes.forEach(function(p){
        seen.add(p.hex);
        var pos = [p.lat, p.lon];
        if (selectedHex && p.hex === selectedHex){
          trailData.push(pos); if (trailData.length > 60) trailData.splice(0, trailData.length - 60);
          trailPolyline.setLatLngs(trailData);
        }
        if (!planeMarkers.has(p.hex)){
          var marker = L.marker(pos, { icon: planeImgIcon(p.hdg, p.alt) }).bindTooltip(tooltipHTML(p));
          marker.addTo(planesLayer);
          attachSelectHandler(marker, p.hex);
          planeMarkers.set(p.hex, { marker:marker, last:now });
        } else {
          var obj = planeMarkers.get(p.hex);
          obj.marker._icon && (obj.marker._icon.style.transition = 'transform 0.6s linear');
          obj.marker.setLatLng(pos);
          obj.marker.setIcon(planeImgIcon(p.hdg, p.alt));
          obj.marker.setTooltipContent(tooltipHTML(p));
          obj.last = now;
        }
      });

      planeMarkers.forEach(function(obj, hex){
        if (!seen.has(hex) && now - obj.last > 60000){
          if (hex === selectedHex){ selectPlane(null); }
          obj.marker.remove(); planeMarkers.delete(hex);
        }
      });

      setStatus('נמצאו ' + planes.length + ' מטוסים | מקור: ADSB.lol דרך Cloudflare Worker' + (selectedHex? ' | שובל למטוס: '+selectedHex : ''));
      updateCircle();
    }catch(e){ setError('שגיאה: ' + e.message); }
  }
  refresh(); setInterval(refresh, 10000);

  // ==== GeoTIFF: טעינה אוטומטית מ-ATS1.tif + אפשרות להחלפה ידנית ====
  async function loadGeoTiffFromUrl(url){
    setError(''); setStatus('טוען GeoTIFF מכתובת: ' + url + ' ...');
    try{
      var r = await fetch(url, { cache:'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var buf = await r.arrayBuffer();
      var georaster = await parseGeoraster(buf);
      if (geoLayer) { map.removeLayer(geoLayer); geoLayer = null; }
      geoLayer = new GeoRasterLayer({ georaster:georaster, opacity:Number(document.getElementById('opacity').value||0.7), resolution:256 });
      geoLayer.addTo(map);
      try{ map.fitBounds(geoLayer.getBounds(), { padding:[30,30] }); } catch(_){}
      setStatus('GeoTIFF נטען בהצלחה מ-' + url);
    }catch(err){ setError('טעינת GeoTIFF נכשלה: ' + err.message); }
  }

  async function loadGeoTiff(file){
    setError(''); setStatus('טוען GeoTIFF מקובץ מקומי...');
    try{
      var arr = await file.arrayBuffer();
      var georaster = await parseGeoraster(arr);
      if (geoLayer) { map.removeLayer(geoLayer); geoLayer = null; }
      geoLayer = new GeoRasterLayer({ georaster:georaster, opacity:Number(document.getElementById('opacity').value||0.7), resolution:256 });
      geoLayer.addTo(map);
      try{ map.fitBounds(geoLayer.getBounds(), { padding:[30,30] }); } catch(_){}
      setStatus('GeoTIFF נטען בהצלחה (קובץ מקומי)');
    }catch(err){ setError('טעינת GeoTIFF נכשלה: ' + err.message + ' | ודא שזה GeoTIFF ב-EPSG:4326'); }
  }

  // טעינה אוטומטית בעת עליית הדף
  loadGeoTiffFromUrl(GEO_TIFF_URL);

  // אירועי UI
  document.getElementById('file').addEventListener('change', function(e){ var f=e.target.files&&e.target.files[0]; if(f) loadGeoTiff(f); });
  document.getElementById('opacity').addEventListener('input', function(e){ if(geoLayer) geoLayer.setOpacity(Number(e.target.value)); });
  document.getElementById('clearOverlay').addEventListener('click', function(){ if(geoLayer){ map.removeLayer(geoLayer); geoLayer=null; setStatus('GeoTIFF הוסר'); }});
  document.getElementById('centerLlbg').addEventListener('click', function(){ map.setView([LLBG.lat, LLBG.lon], 10); updateCircle(); });
  document.getElementById('distNm').addEventListener('change', function(){ DIST_NM = Number(this.value||100); updateCircle(); refresh(); });
  document.getElementById('provider').addEventListener('change', refresh);
</script>
</body>
</html>
