<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>מפת פמ"ת (GeoTIFF) + מטוסים סביב נתב"ג</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height:100%; margin:0; }
    .panel {position:absolute; top:16px; right:16px; z-index:1000; background:#fff; padding:12px 14px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.2); max-width:420px; font-family:system-ui,Arial;}
    .panel h3{margin:0 0 8px; font-size:16px}
    .row{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; margin:8px 0}
    .row-1{margin-top:6px}
    .btn{padding:8px 10px; background:#2563eb; color:#fff; border:0; border-radius:8px; cursor:pointer}
    .btn.secondary{background:#475569}
    #status{font-size:12px; color:#14532d}
    #error{font-size:12px; color:#b91c1c}
    .plane-icon{ width:30px; height:30px; transform:translate(-15px,-15px); }
    .plane-icon img{ width:30px; height:30px; transform-origin:50% 50%; filter: drop-shadow(0 0 1px rgba(0,0,0,.6)); }
    .leaflet-tooltip{direction:rtl; text-align:right}
    .legend{font-size:12px;color:#334155;margin-top:4px}
    .legend span{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:4px;vertical-align:middle}
  </style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h3>מפת פמ"ת (GeoTIFF) + מטוסים סביב נתב"ג</h3>
  <div class="row"><label>Load GeoTIFF (אופציונלי):</label><input id="file" type="file" accept=".tif,.tiff" /></div>
  <div class="row"><label>שקיפות המפה:</label><input id="opacity" type="range" min="0" max="1" step="0.02" value="0.7" /></div>
  <div class="row"><label>מקור נתונים:</label><select id="provider"><option value="adsb.lol">ADSB.lol (דרך ה-Worker)</option></select></div>
  <div class="row"><label>רדיוס (NM):</label><input id="distNm" type="number" min="10" max="150" step="5" value="100" /></div>
  <div class="row"><button id="centerLlbg" class="btn">מרכז נתב"ג</button><button id="clearOverlay" class="btn secondary">הסר GeoTIFF</button></div>
  <div class="legend">צבע לפי גובה: <span style="background:#16a34a"></span> נמוך <span style="background:#2563eb"></span> בינוני <span style="background:#9333ea"></span> גבוה <span style="background:#ef4444"></span> גבוה מאוד</div>
  <div class="row-1"><div id="status"></div><div id="error"></div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/geotiff@2.1.3/dist-browser/geotiff.min.js"></script>
<script src="https://unpkg.com/georaster@1.6.1/dist/georaster.browser.min.js"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>
<script>
  // כעת parseGeoraster מוגדר תקין ואין צורך בייבוא נוסף
  console.log('parseGeoraster loaded:', typeof parseGeoraster);
</script>
</body>
</html>
